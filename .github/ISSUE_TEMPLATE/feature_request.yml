name: Feature request
description: Propose an improvement for the Slate R2 word processor
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Slate R2 is a separate full word-processing product, not an upgrade or replacement for Slate R1. Keep proposals within R2's local-first, cross-form-factor scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the writing or document-management problem, not only the proposed control.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what Slate should do and where the behavior belongs.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include current workarounds or smaller approaches.
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Editing and selection
        - Page layout and pagination
        - Styles and typography
        - Tables and images
        - Library and organization
        - DOCX, PDF, print, and interchange
        - Saving and recovery
        - Phone, tablet, foldable, or Googlebook UI
        - Touch, stylus, mouse, trackpad, or keyboard input
        - Privacy and security
        - Updates and installation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: R2 principles
      options:
        - label: The proposal works without requiring a Slate account.
          required: true
        - label: The proposal preserves local-first writing and does not require telemetry or advertising.
          required: true
        - label: I searched existing open and closed issues.
          required: true
