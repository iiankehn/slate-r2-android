name: R2 Monthly Release

on:
  schedule:
    - cron: "0 15 1 * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish instead of leaving a draft
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SLATE_R2_KEY_ALIAS: ${{ secrets.SLATE_R2_KEY_ALIAS }}
      SLATE_R2_KEYSTORE_PASSWORD: ${{ secrets.SLATE_R2_KEYSTORE_PASSWORD }}
      SLATE_R2_KEY_PASSWORD: ${{ secrets.SLATE_R2_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set release identifiers
        run: |
          echo "SLATE_R2_VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "RELEASE_MONTH=$(date -u +%Y-%m)" >> "$GITHUB_ENV"
      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SLATE_R2_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SLATE_R2_KEY_ALIAS" ] && [ -n "$SLATE_R2_KEYSTORE_PASSWORD" ] && [ -n "$SLATE_R2_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; validating an unsigned debug build without publishing."
          fi
      - name: Restore signing keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SLATE_R2_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/slate-r2.jks"
          echo "SLATE_R2_KEYSTORE_PATH=$RUNNER_TEMP/slate-r2.jks" >> "$GITHUB_ENV"
      - name: Verify and build R2
        run: |
          if [ "${{ steps.signing.outputs.ready }}" = "true" ]; then
            gradle --no-daemon testDebugUnitTest lintDebug assembleRelease
          else
            gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
          fi
      - name: Prepare release files
        if: steps.signing.outputs.ready == 'true'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/Slate-R2-${RELEASE_MONTH}.apk"
          cd release
          sha256sum "Slate-R2-${RELEASE_MONTH}.apk" > "Slate-R2-${RELEASE_MONTH}.apk.sha256"
          apk_sha=$(cut -d ' ' -f 1 "Slate-R2-${RELEASE_MONTH}.apk.sha256")
          printf '{"versionCode":%s,"versionName":"R2","apkUrl":"https://github.com/iiankehn/slate-r2-android/releases/download/r2-%s/Slate-R2-%s.apk","sha256":"%s"}\n' \
            "$SLATE_R2_VERSION_CODE" "$RELEASE_MONTH" "$RELEASE_MONTH" "$apk_sha" \
            > slate-r2-update.json
      - name: Create or refresh GitHub release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          tag="r2-${RELEASE_MONTH}"
          title="Slate R2 — ${RELEASE_MONTH}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            if [ "$PUBLISH" = "true" ]; then
              gh release edit "$tag" --draft=false --title "$title"
            else
              gh release edit "$tag" --draft=true --title "$title"
            fi
          else
            args=(--title "$title" --generate-notes)
            if [ "$PUBLISH" != "true" ]; then args+=(--draft); fi
            gh release create "$tag" release/* "${args[@]}"
          fi
      - name: Upload unsigned validation APK
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: slate-r2-${{ env.RELEASE_MONTH }}-unsigned-validation
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
