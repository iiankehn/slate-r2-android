name: Android CI

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify debug build
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify target architectures
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          native_entries=$(unzip -Z1 "$apk" | grep '^lib/.*/.*\.so$' || true)
          if [ -n "$native_entries" ]; then
            printf '%s\n' "$native_entries" | grep -q '^lib/arm64-v8a/'
            printf '%s\n' "$native_entries" | grep -q '^lib/x86_64/'
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: slate-r2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
